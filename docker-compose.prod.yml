# ============================================
# Docker Compose - Production Configuration
# ============================================

version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hrms_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrms_production}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # HRMS Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hrms_app_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms_production}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hrms_production}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: 5432
      # Session secret (MUST be set in .env file)
      SESSION_SECRET: ${SESSION_SECRET}
      # Email service (MUST be set in .env file)
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms-network

networks:
  hrms-network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
