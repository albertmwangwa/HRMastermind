# ============================================
# Docker Compose - Development Configuration
# ============================================

version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hrms_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # HRMS Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hrms_app_dev
    working_dir: /app
    volumes:
      # Mount source code for hot reload
      - ./client:/app/client
      - ./server:/app/server
      - ./shared:/app/shared
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./drizzle.config.ts:/app/drizzle.config.ts
      # Prevent node_modules from being overwritten
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      # Database connection
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hrms_development
      PGHOST: db
      PGDATABASE: hrms_development
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
      # Session secret (change in production!)
      SESSION_SECRET: dev-secret-key-change-in-production-min-32-chars
      # Email service (optional in dev, use your own key)
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy_key}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms-network
    command: npm run dev

networks:
  hrms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
